services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jouetbois
      POSTGRES_PASSWORD: jouetbois
      POSTGRES_DB: jouetbois
    ports:
      - "5432:5432"
    volumes:
      - jouetbois_pgdata:/var/lib/postgresql/data

volumes:
  jouetbois_pgdata:
